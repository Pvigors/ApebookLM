app:
  host: "0.0.0.0"
  port: 11235
  workers: 1
  timeout_keep_alive: 30

limits:
  max_body_bytes: 1048576
  max_pages: 1
  max_depth: 0
  wall_clock_s: 20
  queue:
    maxsize: 20
    workers: 1
    per_principal: 2

rate_limiting:
  enabled: true
  default_limit: "30/minute"
  trusted_proxies: []
  storage_uri: "memory://"

security:
  enabled: true
  jwt_enabled: false
  api_token: ""
  https_redirect: false
  trusted_hosts: ["crawl4ai", "localhost", "127.0.0.1"]
  cors_allow_origins: []
  headers:
    x_content_type_options: "nosniff"
    x_frame_options: "DENY"
    content_security_policy: "default-src 'none'"

crawler:
  base_config:
    simulate_user: false
  memory_threshold_percent: 85.0
  rate_limiter:
    enabled: true
    base_delay: [1.0, 2.0]
  timeouts:
    stream_init: 10.0
    batch_process: 20.0
  pool:
    max_pages: 2
    idle_ttl_sec: 60
  browser:
    kwargs:
      headless: true
      text_mode: true
    extra_args:
      - "--no-sandbox"
      - "--disable-dev-shm-usage"
      - "--disable-gpu"
      - "--disable-software-rasterizer"

logging:
  level: "INFO"

observability:
  prometheus:
    enabled: true
    endpoint: "/metrics"
  health_check:
    endpoint: "/health"

webhooks:
  enabled: false
