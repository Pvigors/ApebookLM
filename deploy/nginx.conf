# =============================================================================
# ApebookLM 前置反向代理(nginx)
# 放到服务器的 /etc/nginx/conf.d/apebooklm.conf，然后验证配置并重新加载 Nginx。
# 证书与反向代理步骤见 docs/SELF_HOSTING.md；此处路径为 Let's Encrypt 默认位置占位。
# =============================================================================

# —— 边缘限流(纵深防御:应用侧限流是进程内存态,多实例/重启会失效,nginx 按 IP 兜底)——
# 放在 http 上下文(conf.d 文件被 include 进 http{});zone 名全局唯一。
# auth:登录/发码这类洪水敏感端点收紧(10 次/分·IP);general:全站宽松兜底(20 次/秒·IP + 突发)。
limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_status 429;

# HTTP → HTTPS 跳转(并放行 certbot 的 ACME challenge)。
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;   # ← 改成你的域名

    # certbot webroot 校验路径,保持可访问,别一并跳转。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.example.com;   # ← 改成你的域名

    # Let's Encrypt 证书(certbot 默认签发路径,把域名替换成你的)。
    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    # TLS 会话复用,降握手开销。
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 护城河1:单文件 Max 500MB,反代放行阈值留 520M 余量(含 multipart 边界开销)。
    client_max_body_size 520M;
    # 大文件上传 / 长时生成不被反代提前掐断。
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;
    # nginx 接收上传体的超时:默认 60s,500MB 慢速上行会中途断,放宽到 300s。
    client_body_timeout  300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 反代公共头(放 server 级,下面各 location 自动继承)。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 支持 SSE / 流式响应(对话流)不被缓冲。
    proxy_buffering off;

    # 登录 / 发码:洪水敏感,边缘按 IP 收紧(10/分 + 少量突发,超限 429)。
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        # 全站宽松兜底(20/秒 + 较大突发,不误伤 /api/jobs 轮询等正常高频)。
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
}
