name: Publish interactive tour

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "docs/images/**"
      - "public/help/chat-citation.png"
      - "public/brand/yuanbiji-head.png"
      - "public/brand/yuanbiji-head-white.png"
      - ".github/workflows/publish-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package only the public demo assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/demo _site/docs/images _site/public/help _site/public/brand
          cp demo/index.html demo/demo.css demo/demo.js _site/demo/
          cp docs/images/*.png _site/docs/images/
          cp public/help/chat-citation.png _site/public/help/
          cp public/brand/yuanbiji-head.png public/brand/yuanbiji-head-white.png _site/public/brand/
          cp demo/redirect.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
